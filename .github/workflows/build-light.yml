name: Build Hermes Light

# Remote-only desktop client (HERMES_DESKTOP_VARIANT=light): no Python, no local agent.
# Runs the same driver the release workflow uses, unsigned, no secrets.
on:
  workflow_dispatch:
  push:
    branches: [build-light-desktop]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage runnable on older glibc, as the upstream Linux job does.
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build light variant
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: python scripts/bundles/desktop.py --commit "$GITHUB_SHA" --variant light --clean
      - name: List output
        shell: bash
        run: ls -lh apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-light-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
