name: Build Hermes Light

# Remote-only desktop client (HERMES_DESKTOP_VARIANT=light): no Python, no local agent.
# Same driver as the upstream release workflow, unsigned, no secrets.
#
# main carries version 0.0.0 on purpose; the real version comes from the release tag.
# This workflow reads the newest stable vX.Y.Z tag (not the older CalVer v2026.M.D tags) from upstream and bakes it into
# a local commit before building, so artifact names and the app show that version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z. Empty = newest stable tag of NousResearch/hermes-agent'
        required: false
        default: ''
  push:
    branches: [build-light-desktop]

permissions:
  contents: write

jobs:
  prepare:
    name: prepare release
    runs-on: ubuntu-22.04
    steps:
      - name: Create the release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hermes-light -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create hermes-light -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Hermes Light (remote-only desktop client)" \
              --notes "Unsigned builds of the Hermes Light desktop client. Connect it to a remote Hermes backend."

  build:
    needs: prepare
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage runnable on older glibc, as the upstream Linux job does.
          - { name: linux-x64, os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-26 }
          - { name: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set release version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version=$(git ls-remote --tags https://github.com/NousResearch/hermes-agent 'refs/tags/v*' \
              | awk '{print $2}' | sed 's#refs/tags/##' | grep -E '^v[0-9]{1,3}\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $version"; exit 1; }
          echo "Building version $version"
          python - "$version" <<'PY'
          import re, sys
          p = open('pyproject.toml', encoding='utf-8').read()
          p, n = re.subn(r'(?m)^version = "[^"]*"', f'version = "{sys.argv[1]}"', p, count=1)
          assert n == 1
          open('pyproject.toml', 'w', encoding='utf-8', newline='').write(p)
          PY
          # Replace the upstream signer identity in the MSIX manifest with our own subject.
          python - <<'PY'
          import re
          subject = 'OID.2.25.311729368913984317654407730594956997722=1'
          f = 'scripts/msix-shared.mjs'
          t = open(f, encoding='utf-8').read()
          t, n = re.subn(r"(export const OUT_OF_STORE_PUBLISHER =\s*)'[^']*'", lambda m: m.group(1) + "'" + subject + "'", t, count=1)
          assert n == 1, 'publisher constant not found'
          open(f, 'w', encoding='utf-8', newline='').write(t)
          f = 'apps/desktop/electron-builder.config.cjs'
          t = open(f, encoding='utf-8').read()
          old = ": 'Nous Research',"
          assert old in t, 'publisherDisplayName not found'
          t = t.replace(old, ": 'Hermes Light',", 1)
          open(f, 'w', encoding='utf-8', newline='').write(t)
          PY
          git -c user.name=ci -c user.email=ci@example.invalid commit -qam "build: version $version, local publisher"
          echo "HERMES_LIGHT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build light variant
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PYTHONUTF8: '1'
        run: python scripts/bundles/desktop.py --commit "$(git rev-parse HEAD)" --variant light --clean
      - name: List output
        shell: bash
        run: ls -lh apps/desktop/release
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-light-${{ env.HERMES_LIGHT_VERSION }}-${{ matrix.name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.msix
            apps/desktop/release/*.msixbundle
            apps/desktop/release/*.appinstaller
            apps/desktop/release/*.cer
          if-no-files-found: error
      - name: Sign MSIX with a self-signed certificate (Windows)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The MSIX manifest Publisher must equal the signing certificate subject.
          $oid = '2.25.311729368913984317654407730594956997722'
          $subject = "OID.$oid=1"
          $msix = Get-ChildItem apps/desktop/release -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'no .msix found' }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $reader = New-Object System.IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
            $xml = [xml]$reader.ReadToEnd(); $reader.Close()
          } finally { $zip.Dispose() }
          Write-Host "Manifest Publisher: $($xml.Package.Identity.Publisher)"
          if ($xml.Package.Identity.Publisher -ne $subject) { throw 'Manifest Publisher differs from the expected subject' }

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }

          # Build the subject by hand (DER): the attribute type is an unregistered OID,
          # so the string type of its value ("1") has to be chosen explicitly.
          function ConvertTo-Base128([System.Numerics.BigInteger]$n) {
            $b = New-Object System.Collections.Generic.List[byte]
            $b.Add([byte][int][System.Numerics.BigInteger]::Remainder($n, 128))
            $n = [System.Numerics.BigInteger]::Divide($n, 128)
            while ($n -gt 0) {
              $b.Add([byte](128 + [int][System.Numerics.BigInteger]::Remainder($n, 128)))
              $n = [System.Numerics.BigInteger]::Divide($n, 128)
            }
            $b.Reverse()
            return ,$b.ToArray()
          }
          function New-SubjectDer([byte]$stringTag) {
            $arc = [System.Numerics.BigInteger]::Parse('311729368913984317654407730594956997722')
            $oidBody = [byte[]](@(0x69) + (ConvertTo-Base128 $arc))     # 2.25.<arc>: first byte = 2*40+25
            $oidTlv  = [byte[]](@(0x06, $oidBody.Length) + $oidBody)
            $valTlv  = [byte[]](@($stringTag, 0x01, 0x31))               # "1"
            $atv     = [byte[]](@(0x30, ($oidTlv.Length + $valTlv.Length)) + $oidTlv + $valTlv)
            $set     = [byte[]](@(0x31, $atv.Length) + $atv)
            return ,[byte[]](@(0x30, $set.Length) + $set)
          }

          $release = (Resolve-Path apps/desktop/release).Path
          $cerPath = Join-Path $release "HermesLight-$env:HERMES_LIGHT_VERSION-win-x64.cer"
          $pwd = [guid]::NewGuid().ToString('N')
          $backup = Join-Path $env:RUNNER_TEMP 'unsigned.msix'
          Copy-Item $msix.FullName $backup
          $signed = $false

          foreach ($tag in @(0x13, 0x0C)) {   # PrintableString, then UTF8String
            Write-Host ('--- trying value string tag 0x{0:X2}' -f $tag)
            $der = New-SubjectDer ([byte]$tag)
            $dn = New-Object System.Security.Cryptography.X509Certificates.X500DistinguishedName(,$der)
            Write-Host "Subject as Windows renders it: $($dn.Name)"
            $rsa = [System.Security.Cryptography.RSA]::Create(3072)
            $req = New-Object System.Security.Cryptography.X509Certificates.CertificateRequest($dn, $rsa, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
            $req.CertificateExtensions.Add((New-Object System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension($false, $false, 0, $true)))
            $req.CertificateExtensions.Add((New-Object System.Security.Cryptography.X509Certificates.X509KeyUsageExtension([System.Security.Cryptography.X509Certificates.X509KeyUsageFlags]::DigitalSignature, $true)))
            $ekus = New-Object System.Security.Cryptography.OidCollection
            [void]$ekus.Add((New-Object System.Security.Cryptography.Oid('1.3.6.1.5.5.7.3.3')))
            $req.CertificateExtensions.Add((New-Object System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension($ekus, $true)))
            $cert = $req.CreateSelfSigned([DateTimeOffset]::UtcNow.AddDays(-1), [DateTimeOffset]::UtcNow.AddYears(5))
            Write-Host "Certificate subject: $($cert.Subject)"
            $pfx = Join-Path $env:RUNNER_TEMP "hermes-light-$tag.pfx"
            [System.IO.File]::WriteAllBytes($pfx, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $pwd))
            Copy-Item $backup $msix.FullName -Force
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $pwd $msix.FullName
            if ($LASTEXITCODE -eq 0) {
              [System.IO.File]::WriteAllBytes($cerPath, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              $signed = $true
              Write-Host ('Signed with string tag 0x{0:X2}' -f $tag)
              break
            }
            Write-Host ('signtool failed for tag 0x{0:X2} ({1})' -f $tag, $LASTEXITCODE)
          }
          Remove-Item $backup -Force
          if (-not $signed) { throw 'could not sign the MSIX with any certificate variant' }

      - name: Publish to the hermes-light release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=()
          for ext in AppImage dmg zip msix msixbundle appinstaller cer; do
            for f in apps/desktop/release/*."$ext"; do [ -f "$f" ] && files+=("$f"); done
          done
          [ ${#files[@]} -gt 0 ] || { echo "no files to publish"; exit 1; }
          gh release upload hermes-light "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
