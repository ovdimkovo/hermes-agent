name: Build Hermes Light

# Builds the remote-only Hermes desktop client ("light" variant: no Python, no local agent)
# from the official NousResearch/hermes-agent repository and publishes it as a GitHub release.
# This repository holds no Hermes code: each run checks out the upstream release tag.
#
# Once a day the workflow looks up the newest stable upstream tag (vX.Y.Z). If this repository
# has no release for it yet, it builds Linux, macOS and Windows and publishes one release.
# A release is created only when all three builds succeed, so a failed run is retried the next day.

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [build-light-desktop]
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream version X.Y.Z. Empty = newest stable tag'
        required: false
        default: ''
      force:
        description: 'Rebuild even if the release already exists'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-hermes-light
  cancel-in-progress: false

env:
  UPSTREAM: NousResearch/hermes-agent
  # Tag name of the release in this repository: <prefix><version>.
  RELEASE_TAG_PREFIX: test-light-v

jobs:
  check:
    name: check upstream version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            # Stable tags only; skip canaries and the old CalVer tags (v2026.M.D).
            version=$(git ls-remote --tags "https://github.com/$UPSTREAM" 'refs/tags/v*' \
              | awk '{print $2}' | sed 's#refs/tags/##' \
              | grep -E '^v[0-9]{1,3}\.[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/^v//')
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $version"; exit 1; }
          tag="$RELEASE_TAG_PREFIX$version"
          if [ "$FORCE" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            build=false
          else
            echo "Building $version."
            build=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage runnable on older glibc.
          - { name: linux-x64, os: ubuntu-22.04, args: '' }
          # macos-14 is retired; macos-15 arm64 has long queues.
          - { name: macos-arm64, os: macos-26, args: '' }
          # Unpacked app folder, zipped: no MSIX, no certificate.
          - { name: windows-x64, os: windows-latest, args: '-- --dir' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Check out upstream v${{ needs.check.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: v${{ needs.check.outputs.version }}
          fetch-depth: 1
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare the source
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          python - "$VERSION" <<'PY'
          import re, sys

          def patch(path, old, new, regex=False):
              text = open(path, encoding='utf-8').read()
              if regex:
                  text, n = re.subn(old, new, text, count=1)
              else:
                  n = text.count(old)
                  text = text.replace(old, new, 1)
              assert n >= 1, f'{path}: pattern not found: {old!r}'
              open(path, 'w', encoding='utf-8', newline='').write(text)

          # Upstream keeps 0.0.0 in pyproject; the release version comes from the tag.
          patch('pyproject.toml', r'(?m)^version = "[^"]*"', f'version = "{sys.argv[1]}"', regex=True)
          # Plain name "hermes-light": no commit suffix in the exe, app name or data paths.
          patch('apps/desktop/product-identity.cjs', r'const buildCommit = [^\n]*', 'const buildCommit = null', regex=True)
          patch('apps/desktop/product-identity.cjs',
                "display: 'Hermes Light',\n    kebab: 'hermes-light',\n    pascal: 'HermesLight'",
                "display: 'hermes-light',\n    kebab: 'hermes-light',\n    pascal: 'hermes-light'")
          # The Windows build still packs an MSIX, whose Application.Id cannot contain a hyphen.
          patch('apps/desktop/electron-builder.config.cjs', 'applicationId: appNamePascal,', "applicationId: 'HermesLight',")
          PY
          # The build driver packages HEAD and refuses a dirty tree.
          git -c user.name=ci -c user.email=ci@example.invalid commit -qam "hermes-light $VERSION"

      - name: Build
        shell: bash
        working-directory: src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          PYTHONUTF8: '1'
        run: python scripts/bundles/desktop.py --commit "$(git rev-parse HEAD)" --variant light --clean ${{ matrix.args }}

      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          release=src/apps/desktop/release
          ls -lh "$release"
          case "${{ matrix.name }}" in
            linux-x64)   cp "$release"/*.AppImage out/ ;;
            macos-arm64) cp "$release"/*.dmg "$release"/*.zip out/ ;;
            windows-x64)
              dir=$(ls -d "$release"/win*unpacked | head -1)
              (cd "$dir" && 7z a -tzip -mx=7 "$GITHUB_WORKSPACE/out/hermes-light-$VERSION-win-x64-portable.zip" . >/dev/null) ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_PREFIX$VERSION"
          ls -lh out
          gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          cat > notes.md <<NOTES
          Hermes Light $VERSION: the remote-only Hermes desktop client, built from
          [$UPSTREAM v$VERSION](https://github.com/$UPSTREAM/releases/tag/v$VERSION).

          - **Windows:** unzip \`hermes-light-$VERSION-win-x64-portable.zip\` and run \`hermes-light.exe\`.
          - **macOS (Apple Silicon):** open the \`.dmg\`, then run \`xattr -cr /Applications/hermes-light.app\` (the build is unsigned).
          - **Linux:** \`chmod +x hermes-light-*.AppImage\` and run it.

          Connect it to your server: Settings → Gateway → Remote gateway, \`http://<server>:9119\` and the token.
          NOTES
          gh release create "$tag" out/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Hermes Light $VERSION" --notes-file notes.md --prerelease
